<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hitparty">
<meta name="theme-color" content="#14121f">
<title>Hitparty</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{--bg:#14121f;--card:#1f1b33;--tx:#f4f1ff;--mut:#a39cc4;--ac:#ff4fa3;--ac2:#ffb703}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 14px 40px;max-width:520px;margin:auto}
h1{font-size:24px;margin:18px 0 10px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.box{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
button.p{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:700;width:100%;margin-top:8px}
button.s{background:#2d2849;color:var(--tx);border:0;border-radius:12px;padding:13px;font-weight:600;width:100%;margin-top:8px}
input{width:100%;background:#120f20;color:var(--tx);border:1px solid #3a3459;border-radius:10px;padding:10px;font-size:16px}
video{width:100%;border-radius:14px;background:#000;max-height:55vh;object-fit:cover}
.mut{color:var(--mut);font-size:14px}.st{text-align:center;font-size:18px;margin:12px 0}
.big{font-size:46px;font-weight:800;color:var(--ac2);text-align:center}
code{background:#120f20;padding:2px 5px;border-radius:5px;word-break:break-all}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:12px;border:0;border-radius:10px;background:#2d2849;color:var(--mut);font-weight:700;font-size:15px}.seg button.on{background:var(--ac);color:#fff}label.chk{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px;margin-top:12px}label.chk input{width:auto}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,18,31,.6);border-radius:14px;text-align:center;font-weight:800;pointer-events:none}
#ov[hidden]{display:none}
#setup{display:none}
</style></head><body>
<h1>🎵 Hitparty</h1>

<div class="box" id="game">
<div class="seg"><button id="m-person">👤 Wer hat's ausgesucht?</button><button id="m-year">📅 Welches Jahr?</button></div>
<div style="position:relative"><video id="cam" playsinline muted hidden></video><div id="ov" hidden></div></div><canvas id="cv" hidden></canvas>
<div id="status" class="st mut">Bereit.</div>
<pre id="dbg" class="mut" style="white-space:pre-wrap;font-size:12px;margin:0 0 8px"></pre>
<div id="reveal" hidden>
<div class="big" id="r-year"></div>
<div class="st"><b id="r-artist"></b><br><span id="r-title"></span></div>
</div>
<button class="p" id="b-scan">📷 Karte scannen</button>
<button class="s" id="b-pause" hidden>⏯ Pause / Weiter</button>
<button class="s" id="b-reveal" hidden>👀 Auflösen</button>
<label class="chk"><input type="checkbox" id="showsong"> Interpret &amp; Titel beim Auflösen zeigen</label>
<label class="chk"><input type="checkbox" id="webplay"> 🎧 Im Browser abspielen (Spotify-App nicht nötig)</label>
<div id="wps" class="mut" style="font-size:13px;margin-top:4px"></div>
<label class="chk">⏱ Pause nach dem Scannen <select id="delay" style="width:auto;padding:6px"><option value="0">keine</option><option value="2">2 s</option><option value="3">3 s</option><option value="5">5 s</option></select></label>
<button class="s" id="b-set" style="background:none;color:var(--mut);font-size:14px">⚙ Einstellungen</button>
</div>

<div class="box" id="setup">
<b>Einrichtung</b>
<p class="mut">Spotify-Client-ID einfügen. Die Redirect URI muss im Spotify-Dashboard eingetragen sein:<br><code id="redir"></code></p>
<input id="cid" placeholder="Spotify Client ID">
<button class="p" id="b-login">Mit Spotify verbinden</button>
<button class="s" id="b-back">Zurück</button>
<div id="conn" class="st"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const LS={get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const REDIR=location.origin+location.pathname;
const SCOPES='streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

async function login(){
  const id=$('#cid').value.trim(); if(!id)return alert('Bitte Client ID eintragen.');
  LS.set('cid',id);
  const v=b64(crypto.getRandomValues(new Uint8Array(32)));
  localStorage.setItem('verifier',v);
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:id,response_type:'code',redirect_uri:REDIR,scope:SCOPES,code_challenge_method:'S256',code_challenge:ch});
}
async function token(body){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:LS.get('cid',''),...body})});
  const j=await r.json();
  if(!j.access_token)throw new Error(j.error_description||'Login fehlgeschlagen');
  LS.set('tok',{a:j.access_token,r:j.refresh_token||(LS.get('tok',{}).r),exp:Date.now()+j.expires_in*1000-30000});
}
async function api(path,opt={}){
  let t=LS.get('tok'); if(!t)throw new Error('Nicht mit Spotify verbunden (⚙ Einstellungen).');
  if(Date.now()>t.exp){await token({grant_type:'refresh_token',refresh_token:t.r});t=LS.get('tok')}
  return fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t.a,'Content-Type':'application/json'}});
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let L=[];
async function playTrack(id){
  L=[];
  const body=JSON.stringify({uris:['spotify:track:'+id],position_ms:0});
  let dj={};try{dj=await(await api('/me/player/devices')).json()}catch(e){L.push('Geräte-Fehler: '+e.message)}
  const devs=dj.devices||[];
  L.push('Geräte: '+(devs.map(d=>d.name+' ('+d.type+(d.is_active?', aktiv':'')+(d.is_restricted?', eingeschränkt':'')+', Lautstärke '+d.volume_percent+')').join('; ')||'keine'));
  const useWeb=$('#webplay').checked&&webId;
  L.push('Wiedergabe über: '+(useWeb?'Browser-Player':'Spotify-Gerät'));
  const dev=useWeb?{id:webId,is_active:devs.some(d=>d.id===webId&&d.is_active)}:(devs.find(d=>d.is_active)||devs.find(d=>/computer|smartphone|tablet/i.test(d.type))||devs[0]);
  const q=dev?'?device_id='+dev.id:'';
  try{const tj=await(await api('/tracks/'+id+'?market=from_token')).json();L.push('Song spielbar: '+(tj.is_playable===false?'NEIN ('+((tj.restrictions&&tj.restrictions.reason)||'?')+')':'ja'))}catch(e){L.push('Song-Prüfung: '+e.message)}
  if(dev&&!dev.is_active){const t=await api('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[dev.id],play:false})});L.push('Umschalten: '+t.status);await sleep(900)}
  const go=()=>api('/me/player/play'+q,{method:'PUT',body});
  let r=await go();L.push('Abspielen: '+r.status);
  for(let i=0;i<2&&!(r.ok||r.status===204);i++){await sleep(1000);r=await go();L.push('Wiederholung: '+r.status)}
  if(!(r.ok||r.status===204)){
    let m='';try{m=(await r.json()).error.message}catch{}
    return 'Fehler '+r.status+(m?' – '+m:'')+(dev?'':' (kein Gerät gefunden)');
  }
  await sleep(1300);
  try{
    const st=await api('/me/player');
    if(st.status===200){
      const s=await st.json();
      L.push('Status: '+(s.is_playing?'spielt':'pausiert')+', Lied: '+(s.item?s.item.name:'keins')+', Gerät: '+(s.device?s.device.name:'?'));
      if(!s.is_playing||!s.item||s.item.id!==id){const r2=await go();L.push('Nochmal abspielen: '+r2.status);await sleep(800)}
    }else L.push('Status-Abfrage: '+st.status);
  }catch(e){L.push('Status-Fehler: '+e.message)}
  return '';
}
let paused=false,current=null,stream=null,scanning=false;
async function togglePause(){
  const r=await api(paused?'/me/player/play':'/me/player/pause',{method:'PUT'});
  if(r.ok||r.status===204)paused=!paused;
}
function parse(raw){const p=raw.split('|');return{id:p[0],name:p[1]?decodeURIComponent(p[1]):'',year:p[2]?+p[2]:0}}
let mode=LS.get('mode','person');
function setMode(m){mode=m;LS.set('mode',m);$('#m-person').classList.toggle('on',m==='person');$('#m-year').classList.toggle('on',m==='year');$('#reveal').hidden=true}
async function onCode(raw){
  scanning=false;current=parse(raw);const id=current.id;paused=false;$('#reveal').hidden=true;
  const dl=+LS.get('delay',3);
  $('#ov').hidden=false;
  for(let i=dl;i>0;i--){$('#ov').innerHTML='<div style="font-size:20px">Gleich geht\'s los …</div><div style="font-size:84px;line-height:1.1;color:var(--ac2)">'+i+'</div>';$('#status').textContent='✅ Song erkannt';await sleep(1000)}
  $('#ov').hidden=true;
  stopScan();
  $('#status').textContent='⏳ Starte Song …';
  try{
    const err=await playTrack(id),ok=!err;$('#dbg').textContent=L.join('\n');
    $('#status').textContent=ok?(mode==='person'?'🎶 Song läuft! Wer hat ihn ausgesucht?':'🎶 Song läuft! Welches Jahr?'):'Spotify meldet: '+err+'. Tipp: Spotify-App öffnen, einen Song starten und erneut versuchen.';
  }catch(e){$('#status').textContent=e.message}
  $('#b-pause').hidden=$('#b-reveal').hidden=false;
  $('#b-scan').textContent='📷 Nächste Karte scannen';
}
async function reveal(){
  try{
    const c=current,show=$('#showsong').checked;
    let j=null;
    if(show||(mode==='year'&&!c.year))j=await(await api('/tracks/'+c.id)).json();
    const y=c.year||(j?+j.album.release_date.slice(0,4):0);
    $('#r-year').textContent=mode==='person'?(c.name||'(kein Name im Code)'):(y+' · '+Math.floor(y/10)*10+'er');
    $('#r-artist').textContent=show&&j?j.artists.map(a=>a.name).join(', '):'';
    $('#r-title').textContent=show&&j?j.name:'';
    $('#reveal').hidden=false;
  }catch(e){$('#status').textContent=e.message}
}
async function startScan(){
  $('#reveal').hidden=true;$('#b-pause').hidden=$('#b-reveal').hidden=true;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}})}
  catch(e){$('#status').textContent='Kamera nicht verfügbar ('+(e.name||'Fehler')+'). Bitte Zugriff erlauben und die Seite im Browser öffnen.';return}
  const v=$('#cam');v.srcObject=stream;v.hidden=false;v.onclick=refocus;await v.play();frames=0;refocus();
  scanning=true;$('#status').textContent='Halte den QR-Code ins Bild … (Tipp aufs Bild stellt scharf)';loop();
}
function stopScan(){scanning=false;$('#ov').hidden=true;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#cam').hidden=true}
const bd=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
let frames=0;
async function refocus(){
  try{
    const tr=stream&&stream.getVideoTracks()[0];if(!tr)return;
    const m=(tr.getCapabilities?tr.getCapabilities():{}).focusMode||[];
    if(m.includes('single-shot')){await tr.applyConstraints({advanced:[{focusMode:'single-shot'}]});await sleep(500)}
    if(m.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]});
  }catch(e){}
}
async function loop(){
  if(!scanning)return;
  try{
    const v=$('#cam'),c=$('#cv');
    if(v.readyState>=2&&v.videoWidth){
      frames++;
      if(frames%90===0)refocus();
      let data=null;
      try{if(bd){const r=await bd.detect(v);if(r.length)data=r[0].rawValue}}catch(e){}
      if(!data&&scanning){
        const w=Math.min(frames%2?960:480,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);
        c.width=w;c.height=h;
        const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);
        const code=jsQR(x.getImageData(0,0,w,h).data,w,h);
        if(code)data=code.data;
      }
      if(!scanning)return;
      if(data){
        if(data.startsWith('hitparty:')){onCode(data.slice(9));return}
        $('#status').textContent='QR gefunden, aber kein Hitparty-Code: '+data.slice(0,40);
      }else if(frames%15===0){$('#status').textContent='Suche Code … ('+v.videoWidth+'×'+v.videoHeight+', '+(bd?'nativ':'Software')+', Bild '+frames+')'}
    }
  }catch(e){$('#status').textContent='Scanfehler: '+e.message}
  if(scanning)requestAnimationFrame(loop);
}
function showSetup(on){$('#setup').style.display=on?'block':'none';$('#game').style.display=on?'none':'block';if(on)stopScan()}
let webId=null,wp=null,sdkReady=false;
window.onSpotifyWebPlaybackSDKReady=()=>{sdkReady=true;startWeb()};
function startWeb(){
  if(!sdkReady||wp||!LS.get('tok'))return;
  wp=new Spotify.Player({name:'Hitparty (Browser)',volume:1,getOAuthToken:async cb=>{try{await api('/me/player/devices')}catch{}cb((LS.get('tok')||{}).a)}});
  wp.addListener('ready',({device_id})=>{webId=device_id;$('#wps').textContent='🎧 Browser-Player bereit'});
  wp.addListener('not_ready',()=>{webId=null;$('#wps').textContent='Browser-Player nicht bereit'});
  const msgs={authentication_error:'Bitte unter ⚙ Einstellungen neu verbinden.',initialization_error:'Dieser Browser unterstützt den Browser-Player nicht.',account_error:'Spotify Premium nötig.',playback_error:'Wiedergabefehler.'};
  Object.keys(msgs).forEach(e=>wp.addListener(e,m=>{$('#wps').textContent='⚠ '+msgs[e]+' ('+m.message+')';if(typeof L!=='undefined')L.push(e+': '+m.message)}));
  wp.connect();
}
async function init(){
  $('#redir').textContent=REDIR;$('#cid').value=LS.get('cid','');
  const c=new URLSearchParams(location.search).get('code');
  if(c){
    history.replaceState({},'',REDIR);
    try{await token({grant_type:'authorization_code',code:c,redirect_uri:REDIR,code_verifier:localStorage.getItem('verifier')})}catch(e){alert(e.message)}
  }
  const on=!!LS.get('tok');
  $('#conn').textContent=on?'✅ Mit Spotify verbunden':'Noch nicht verbunden';
  showSetup(!on);
  startWeb();
}
$('#b-login').onclick=login;$('#b-scan').onclick=()=>{if(wp&&wp.activateElement)wp.activateElement();startScan()};$('#b-pause').onclick=togglePause;
$('#b-reveal').onclick=reveal;$('#m-person').onclick=()=>setMode('person');$('#m-year').onclick=()=>setMode('year');$('#showsong').checked=LS.get('showsong',false);$('#showsong').onchange=e=>LS.set('showsong',e.target.checked);setMode(mode);$('#webplay').checked=LS.get('webplay',true);$('#webplay').onchange=e=>LS.set('webplay',e.target.checked);$('#delay').value=LS.get('delay',3);$('#delay').onchange=e=>LS.set('delay',+e.target.value);$('#b-set').onclick=()=>showSetup(true);$('#b-back').onclick=()=>showSetup(false);
init();
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script></body></html>
